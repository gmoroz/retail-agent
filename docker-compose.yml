# Postgres + pgvector: single store for the LangGraph checkpointer (chat history)
# and the Golden bucket (embeddings). Use `make db-up` / `make db-down`.
services:
  db:
    image: pgvector/pgvector:pg17
    container_name: retail-agent-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
