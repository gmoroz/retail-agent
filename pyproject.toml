[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "retail-agent"
version = "0.1.0"
description = "CLI chat agent for retail analytics on LangGraph + BigQuery + OpenRouter"
requires-python = "==3.13.12"
dependencies = [
    "langgraph==1.2.5",
    "langchain==1.3.9",
    "langchain-core==1.4.7",
    "google-cloud-bigquery==3.42.0",
    "db-dtypes==1.7.0",
    "pandas==3.0.3",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.1",
    "python-dotenv==1.2.2",
    "langgraph-checkpoint-postgres==3.1.0",
    "psycopg[binary]==3.3.4",
    "psycopg-pool==3.3.0",
    "pgvector==0.4.2",
    "langchain-openai==1.3.2",
    "sqlglot==30.11.0",
    "sqlalchemy==2.0.51",
    "alembic==1.18.4",
    "openai==2.43.0",
]

[project.optional-dependencies]
dev = [
    "ruff==0.15.17",
    "mypy==2.1.0",
    "pytest==9.1.0",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "coverage==7.14.1",
    "pandas-stubs==3.0.3.260530",
    "types-requests==2.33.0.20260518",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",        # pycodestyle errors
    "W",        # pycodestyle warnings
    "F",        # pyflakes
    "I",        # isort
    "B",        # flake8-bugbear
    "C4",       # flake8-comprehensions
    "UP",       # pyupgrade
    "ARG",      # flake8-unused-arguments
    "SIM",      # flake8-simplify
    "TID",      # flake8-tidy-imports
    "RUF",      # ruff-specific rules
    "PLC0415",  # import-outside-toplevel
    "T201",     # print() forbidden in production code
    "BLE001",   # bare except Exception forbidden
    "FIX001",   # FIXME forbidden
    "FIX002",   # TODO forbidden
    "FIX004",   # HACK forbidden
    "ASYNC251", # time.sleep in async forbidden
]
ignore = [
    "RUF001", # String contains ambiguous unicode character
    "RUF002", # Docstring contains ambiguous unicode character
    "RUF003", # Comment contains ambiguous unicode character
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"requests" = { msg = "Use google-cloud client or httpx for I/O. requests blocks the event loop." }

[tool.ruff.lint.per-file-ignores]
"src/retail_agent/cli.py" = ["T201"]
"src/retail_agent/__main__.py" = ["T201"]
"**/tests/**" = ["ARG", "T201"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
explicit_package_bases = true
mypy_path = "src"

strict = true

warn_unreachable = true
warn_no_return = true

follow_imports = "silent"

show_column_numbers = true
show_error_context = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "langgraph.*",
    "langchain.*",
    "langchain_core.*",
    "langchain_openai.*",
    "openai.*",
    "google.cloud.*",
    "google.api_core.*",
    "db_dtypes.*",
    "psycopg.*",
    "psycopg_pool.*",
    "pgvector.*",
    "sqlglot.*",
]
ignore_missing_imports = true
follow_imports = "silent"

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: requires live infrastructure (BigQuery, OpenRouter, Postgres)",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
